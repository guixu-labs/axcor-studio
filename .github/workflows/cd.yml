name: CD
run-name: CD · ${{ github.ref_name }}

# Dispatch on an exact branch or tag. Mirrored tag pushes do not start CD.
on:
  workflow_dispatch:
    inputs:
      create_release:
        description: Publish a GitHub Release (requires a version tag)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}

jobs:
  validate:
    name: Validate release ref
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - name: Require a tag for publishing
        if: inputs.create_release && github.ref_type != 'tag'
        run: |
          echo "::error::Dispatch on a vX.Y.Z tag to publish a release."
          exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: github.ref_type == 'tag'
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        if: github.ref_type == 'tag'
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Check tag and package versions
        if: github.ref_type == 'tag'
        run: node scripts/release-version.mjs "$GITHUB_REF_NAME"

  ci:
    needs: validate
    uses: ./.github/workflows/ci.yml

  package:
    name: Package macOS arm64
    needs: ci
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - name: Verify build architecture
        run: test "$(uname -m)" = arm64
      - run: npm ci
      - run: npm run package
      - run: npm run verify:package
      - run: npm run make -- --skip-package
      - name: Smoke-test the macOS ZIP
        shell: bash
        run: |
          smoke=$(mktemp -d)
          ditto -x -k out/make/zip/darwin/arm64/*.zip "$smoke"
          app="$smoke/axcor-studio.app"
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/axcor-studio" --user-data-dir="$smoke/profile" > "$smoke/startup.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          sleep 5
          if ! kill -0 "$app_pid" || grep -E 'ERR_FILE_NOT_FOUND|\[startup\]' "$smoke/startup.log"; then
            cat "$smoke/startup.log"
            exit 1
          fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: desktop-macos-arm64
          path: out/make/zip/darwin/arm64/*.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: inputs.create_release && github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: desktop-macos-arm64
          path: artifacts
      - name: Prepare release checksum
        shell: bash
        run: |
          shopt -s nullglob
          cd artifacts
          files=(axcor-studio-darwin-arm64-*.zip)
          if (( ${#files[@]} != 1 )); then
            echo "::error::Expected exactly one macOS arm64 ZIP."
            exit 1
          fi
          sha256sum -- "${files[0]}" > SHA256SUMS.txt
      - name: Verify tag is eligible for release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" > /dev/null
          published=$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[] | select(.draft == false) | .tag_name')
          if grep -Fxq -- "$RELEASE_TAG" <<< "$published"; then
            echo "::error::Release $RELEASE_TAG has already been published."
            exit 1
          fi
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/axcor-studio-darwin-arm64-*.zip
            artifacts/SHA256SUMS.txt
