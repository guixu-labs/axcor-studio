name: Tag Release

on:
  push:
    branches: [main]
    paths: [package.json]

permissions:
  contents: write
  actions: write

concurrency:
  group: tag-release-${{ github.sha }}

jobs:
  tag:
    # The initial push imports the repository. A release starts with a later version change.
    if: ${{ !github.event.created && !github.event.deleted }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Detect version change
        id: version
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if ! git cat-file -e "$BEFORE^{commit}"; then
            git fetch --no-tags origin "$BEFORE"
          fi
          previous=
          if git cat-file -e "$BEFORE:package.json" 2>/dev/null; then
            previous=$(git show "$BEFORE:package.json" | node -pe 'JSON.parse(require("node:fs").readFileSync(0, "utf8")).version')
          fi
          current=$(node -p 'require("./package.json").version')
          if [[ "$current" == "$previous" ]]; then
            echo "Version unchanged ($current)."
            exit 0
          fi
          tag=$(node scripts/release-version.mjs)
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
      - name: Push tag and dispatch CD
        if: steps.version.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          ref="refs/tags/$TAG"
          existing=$(git ls-remote --refs origin "$ref")
          if [[ -z "$existing" ]]; then
            git push origin "HEAD:$ref"
          else
            git fetch --no-tags origin "$ref"
            if [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" != "$GITHUB_SHA" ]]; then
              echo "::error::Tag $TAG already points to a different commit."
              exit 1
            fi
          fi

          gh workflow run cd.yml --ref "$TAG" -f create_release=true
